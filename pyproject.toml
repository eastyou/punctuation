[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "punctuation"
version = "0.1.0"
description = "中文标点符号：规则查询、配对检查和练习单生成"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "chinese", "punctuation", "teaching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
punctuation = "punctuation.cli:main"

[tool.setuptools]
packages = ["punctuation"]
